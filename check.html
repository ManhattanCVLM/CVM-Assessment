<!doctype html>
<!-- Deployment checker — built by build_editions.py, not edited in the repository.
     Lives beside the client app at /CVM-Assessment/check.html. All four Pages
     sites share one github.io origin, which is the only reason one page can read
     the other three. -->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CVM Deployment Check</title>
<meta name="theme-color" content="#1f7a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CVM Check">
<!-- Its own manifest, and its own icons. Pointing this page at the app's
     manifest.webmanifest would install an icon that opens the assessment
     instead of the checker, which is the whole thing to avoid. -->
<link rel="apple-touch-icon" href="check-apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="check-icon-192.png">
<link rel="manifest" href="check.webmanifest">
<style>
  :root{
    --ink:#191917; --muted:#6b6a63; --bg:#fbfbfa; --card:#fff;
    --border:rgba(25,25,23,.12); --brand:#1f7a45; --radius:14px;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root{--ink:#f5f4ef; --muted:#a3a29b; --bg:#141413; --card:#1d1d1b; --border:rgba(245,244,239,.14)}
  }
  *{box-sizing:border-box}
  body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
       margin:0;background:var(--bg);color:var(--ink);
       padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
               max(48px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
       -webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto}
  /* The mark has a transparent background: on a dark scheme it would vanish, so
     it always sits on its own white plate — same as the app's setup page. */
  .logoplate{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
             padding:14px 16px;display:flex;justify-content:center;margin:0 0 18px}
  .logoplate img{display:block;width:100%;max-width:200px;height:auto}
  h1{font-size:21px;margin:0 0 5px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  button{font:inherit;font-weight:650;padding:11px 18px;border-radius:11px;border:0;
         background:var(--brand);color:#fff;cursor:pointer;margin-bottom:16px;
         -webkit-tap-highlight-color:transparent}
  button:active{opacity:.85}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
        overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top}
  tr:last-child td{border-bottom:0}
  th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650}
  td.app{font-weight:650}
  .ok{color:#1f7a45;font-weight:650;white-space:nowrap}
  .old{color:#b06a00;font-weight:650;white-space:nowrap}
  .bad{color:#b3261e;font-weight:650}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  .sw{color:var(--muted)}
  .note{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:18px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:22px;border-top:1px solid var(--border);padding-top:12px}
</style></head><body><div class="wrap">

<h1>What is actually deployed</h1>
<p class="sub">Reads each of the four sites the way a visitor's browser would, bypassing every cache.
Run it after a push.</p>
<button id="again">Check again</button>
<div class="card">
<table>
  <thead><tr><th>App</th><th>Build being served</th><th>Cache</th><th></th></tr></thead>
  <tbody id="rows"><tr><td colspan="4">Checking…</td></tr></tbody>
</table>
</div>
<div class="note" id="note"></div>
<div class="foot">Manhattan CVLM &middot; checker build 3.7 · 20 Aug 2026</div>
</div>
<script>
/* cache:"no-store" is the point of this page — it asks the server, not the
   browser's own cupboard, which is what makes it trustworthy right after a push. */
const APPS = [
  { name: "Client app",   path: "../CVM-Assessment/" },
  { name: "Self",         path: "../CVM-Assessment-Self/" },
  { name: "External",     path: "../CVM-Assessment-Ext/" },
  { name: "Consolidator", path: "../CVM-Consolidation/" }
];
const grab = async (url, re) => {
  try {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) return { err: r.status };
    const m = (await r.text()).match(re);
    return { val: m ? m[1] : "not found" };
  } catch (e) { return { err: e.message || "unreachable" }; }
};
async function run() {
  document.getElementById("rows").innerHTML = '<tr><td colspan="4">Checking…</td></tr>';
  const out = [];
  for (const a of APPS) {
    const [b, c] = await Promise.all([
      grab(a.path + "index.html", /const BUILD = "([^"]+)"/),
      grab(a.path + "sw.js", /const CACHE = "([^"]+)"/)
    ]);
    out.push({ ...a, build: b, cache: c });
  }
  const builds = out.map(o => o.build.val).filter(Boolean);
  const newest = builds.filter(Boolean).sort().reverse()[0];
  document.getElementById("rows").innerHTML = out.map(o => {
    if (o.build.err) return `<tr><td class="app">${o.name}</td><td colspan="2" class="bad">
      not being served (${o.build.err === 404 ? "404 — is Pages switched on for this repository?" : o.build.err})</td>
      <td class="bad">&#10007;</td></tr>`;
    const current = o.build.val === newest;
    return `<tr><td class="app">${o.name}</td>
      <td>${o.build.val}</td>
      <td class="sw"><code>${o.cache.val || o.cache.err}</code></td>
      <td class="${current ? "ok" : "old"}">${current ? "&#10003; current" : "behind"}</td></tr>`;
  }).join("");
  const behind = out.filter(o => !o.build.err && o.build.val !== newest).map(o => o.name);
  const dead = out.filter(o => o.build.err).map(o => o.name);
  document.getElementById("note").innerHTML =
    (dead.length ? `<b>Not served:</b> ${dead.join(", ")}. A 404 here almost always means Pages is off for
      that repository — Settings &rsaquo; Pages &rsaquo; Deploy from a branch &rsaquo; main &rsaquo; / (root).<br><br>` : "") +
    (behind.length ? `<b>Behind:</b> ${behind.join(", ")} — upload the newer build to those repositories.<br><br>` : "") +
    (!dead.length && !behind.length ? `<b>All four are serving ${newest}.</b><br><br>` : "") +
    `This reads what the <i>server</i> holds. A phone that already has the app installed picks a new version up
     on its next open; if one looks stuck, close it fully and reopen. "Behind" is judged by comparing the four
     against each other, so it tells you they disagree, not that any particular one is out of date.`;
}
document.getElementById("again").onclick = run;
run();
</script>
