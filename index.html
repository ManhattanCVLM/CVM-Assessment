<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CVM Assess">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<title>CVM Maturity Assessment</title>
<!-- icons come from the native app bundle -->
<style>
:root{
  color-scheme: light;
  --surface-0:#f4f3f0; --surface-1:#fcfcfb; --surface-2:#ffffff;
  --border:#e2e0da; --border-strong:#cdcac1;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7b7a74;
  --series-1:#2a78d6; --series-2:#eb6834;
  --series-1-soft:#e5eefb; --series-2-soft:#fdece4;
  --seq-100:#cde2fb; --seq-250:#86b6ef; --seq-400:#3987e5; --seq-550:#1c5cab; --seq-700:#0d366b;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --neutral-mid:#f0efec;
  --grid:#eae8e2;
  --accent:#2a78d6;
  --shadow:0 1px 2px rgba(11,11,11,.06),0 1px 8px rgba(11,11,11,.04);
  --radius:14px;
  --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-0:#111110; --surface-1:#1a1a19; --surface-2:#232322;
    --border:#333330; --border-strong:#464642;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#98978d;
    --series-1:#3987e5; --series-2:#d95926;
    --series-1-soft:#17263a; --series-2-soft:#33200f;
    --seq-100:#0d366b; --seq-250:#184f95; --seq-400:#256abf; --seq-550:#3987e5; --seq-700:#86b6ef;
    --neutral-mid:#383835;
    --grid:#2b2b29;
    --accent:#3987e5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 1px 8px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-0:#111110; --surface-1:#1a1a19; --surface-2:#232322;
  --border:#333330; --border-strong:#464642;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#98978d;
  --series-1:#3987e5; --series-2:#d95926;
  --series-1-soft:#17263a; --series-2-soft:#33200f;
  --seq-100:#0d366b; --seq-250:#184f95; --seq-400:#256abf; --seq-550:#3987e5; --seq-700:#86b6ef;
  --neutral-mid:#383835;
  --grid:#2b2b29;
  --accent:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 1px 8px rgba(0,0,0,.25);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--surface-0); color:var(--text-primary);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--accent)}

/* ---------- app shell ---------- */
#app{display:flex;flex-direction:column;min-height:100%}
.topbar{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface-1) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;
}
.topbar-row{display:flex;align-items:center;gap:10px;min-height:34px}
.topbar h1{font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:12.5px;color:var(--text-muted);margin-top:1px}
.iconbtn{
  min-width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--accent);font-size:14.5px;font-weight:600;padding:0 8px;flex:none
}
.iconbtn:active{background:var(--surface-2)}
main{flex:1;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
body.has-fab main{padding-bottom:calc(146px + env(safe-area-inset-bottom))}
.view[hidden]{display:none}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:color-mix(in srgb,var(--surface-1) 92%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:550;color:var(--text-muted);letter-spacing:.01em;min-height:var(--tap)
}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- cards ---------- */
.card{
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px;margin-bottom:12px
}
.card.tight{padding:12px}
.card-title{font-size:13px;font-weight:650;letter-spacing:.02em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:2px}
.card-note{font-size:12.5px;color:var(--text-muted);margin-bottom:12px;line-height:1.4}
.section-label{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin:20px 2px 8px}
.section-label:first-child{margin-top:2px}

/* ---------- area list ---------- */
.arealist{display:flex;flex-direction:column;gap:10px}
.arearow{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:13px 14px;min-height:var(--tap)
}
.arearow:active{background:var(--surface-2)}
.arearow .meta{flex:1;min-width:0}
.arearow .nm{font-size:15.5px;font-weight:600;line-height:1.25}
.arearow .dt{font-size:12.5px;color:var(--text-muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chev{color:var(--text-muted);flex:none;font-size:19px;line-height:1}
.ring{flex:none;width:46px;height:46px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums
}

/* ---------- lane switch (self / external) ---------- */
.lanes{display:flex;gap:6px;background:var(--surface-0);border:1px solid var(--border);border-radius:11px;padding:3px;margin-bottom:12px}
.lanes button{
  flex:1;min-height:38px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center;gap:7px
}
.lanes button[aria-pressed="true"]{background:var(--surface-2);color:var(--text-primary);box-shadow:var(--shadow)}
.swatch{width:9px;height:9px;border-radius:2px;flex:none}
.sw1{background:var(--series-1)} .sw2{background:var(--series-2)}

/* ---------- question card ---------- */
.qcard{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.qhead{display:flex;gap:8px;align-items:baseline;margin-bottom:7px}
.qnum{font-size:11.5px;font-weight:650;color:var(--text-muted);font-variant-numeric:tabular-nums;flex:none}
.qtext{font-size:15px;line-height:1.4;font-weight:450}
.subjtag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--text-secondary);background:var(--surface-0);border:1px solid var(--border);border-radius:999px;padding:2px 9px;margin-bottom:8px}
.scale{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:11px}
.scale button{
  min-height:42px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface-2);
  font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center
}
.scale button:active{transform:scale(.94)}
.scale button[aria-pressed="true"]{color:#fff;border-color:transparent}
.lane-self .scale button[aria-pressed="true"]{background:var(--series-1)}
.lane-external .scale button[aria-pressed="true"]{background:var(--series-2)}
.scalefoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;font-size:12.5px}
.levelname{font-weight:600;color:var(--text-primary)}
.levelname.empty{color:var(--text-muted);font-weight:450}
.otherlane{color:var(--text-secondary);display:flex;align-items:center;gap:6px;font-size:12px;flex:none}
.qactions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.minibtn{
  border:1px solid var(--border-strong);border-radius:9px;padding:0 12px;min-height:36px;
  font-size:13px;font-weight:600;color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px
}
.minibtn:active{background:var(--surface-0)}
.minibtn.on{color:var(--accent);border-color:var(--accent)}
.cmtwrap{margin-top:10px}
.cmtwrap[hidden]{display:none}
.cmtwrap label{display:block;font-size:11.5px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px}
textarea{
  width:100%;min-height:76px;padding:10px 11px;border:1px solid var(--border-strong);border-radius:10px;
  background:var(--surface-2);resize:vertical;line-height:1.4
}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.savedcmt{font-size:13px;color:var(--text-secondary);background:var(--surface-0);border-left:3px solid var(--border-strong);padding:8px 10px;border-radius:0 8px 8px 0;margin-top:9px;white-space:pre-wrap}
.savedcmt b{display:block;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px;font-weight:650}

/* ---------- filter row ---------- */
.filters{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--border-strong);border-radius:999px;padding:0 13px;min-height:34px;
  font-size:13px;font-weight:600;color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px;
  background:var(--surface-1)
}
.chip[aria-pressed="true"]{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap input{
  width:100%;min-height:40px;padding:0 36px 0 12px;border:1px solid var(--border-strong);
  border-radius:11px;background:var(--surface-1)
}
.searchwrap .clr{position:absolute;right:4px;top:3px;width:34px;height:34px;color:var(--text-muted);font-size:17px}

/* ---------- subject group ---------- */
.subjgroup{margin-bottom:8px}
.subjhead{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 13px;min-height:var(--tap);
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)
}
.subjhead .nm{flex:1;font-size:14.5px;font-weight:600;line-height:1.3}
.subjhead .cnt{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;flex:none}
.subjhead .caret{color:var(--text-muted);flex:none;transition:transform .18s;font-size:12px}
.subjhead[aria-expanded="true"]{border-radius:var(--radius) var(--radius) 0 0}
.subjhead[aria-expanded="true"] .caret{transform:rotate(90deg)}
.subjbody{padding:10px 0 2px}
.subjbody[hidden]{display:none}
.dualpair{display:flex;gap:3px;align-items:center;flex:none}
.dualpair span{
  min-width:23px;height:23px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;color:#fff
}
.dualpair .d1{background:var(--series-1)} .dualpair .d2{background:var(--series-2)}
.dualpair .dn{background:var(--surface-0);color:var(--text-muted);border:1px dashed var(--border-strong)}
/* ---------- dashboard ---------- */
.hero{display:flex;gap:10px;margin-bottom:12px}
.tile{
  flex:1;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:13px 14px;min-width:0
}
.tile .lbl{font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.tile .val{font-size:30px;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:5px}
.tile .val small{font-size:14px;font-weight:550;color:var(--text-muted);letter-spacing:0}
.tile .cap{font-size:12px;color:var(--text-secondary);margin-top:2px;line-height:1.3}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:block}

.bars{display:flex;flex-direction:column;gap:13px}
.barrow{width:100%;text-align:left;display:block;background:none;padding:0}
.barrow .cat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.barrow .cat .nm{font-size:13.5px;font-weight:600;line-height:1.25;min-width:0}
.barrow .cat .gp{font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;flex:none;letter-spacing:.01em}
.track{position:relative;height:11px;background:var(--grid);border-radius:4px;margin-bottom:2px}
.track:last-of-type{margin-bottom:0}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:3px;transition:width .35s cubic-bezier(.3,.9,.3,1)}
.fill.f1{background:var(--series-1)} .fill.f2{background:var(--series-2)}
.barvals{display:flex;gap:10px;margin-top:5px;font-size:11.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.barvals b{color:var(--text-primary);font-weight:650}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;margin-top:9px;padding-top:7px;border-top:1px solid var(--grid)}

.gaplist{display:flex;flex-direction:column;gap:2px}
.gapitem{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--grid)}
.gapitem:last-child{border-bottom:0}
.gapitem .txt{flex:1;min-width:0}
.gapitem .q{font-size:13.5px;line-height:1.35}
.gapitem .a{font-size:11.5px;color:var(--text-muted);margin-top:3px}
.gapchip{
  flex:none;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;
  font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;border:1px solid transparent
}
.gapchip.over{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent);border-color:color-mix(in srgb,var(--good) 34%,transparent)}
.gapchip.under{color:var(--critical);background:color-mix(in srgb,var(--critical) 12%,transparent);border-color:color-mix(in srgb,var(--critical) 34%,transparent)}
.gapchip.flat{color:var(--text-secondary);background:var(--surface-0);border-color:var(--border-strong)}

table.dt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.dt th,table.dt td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--grid);white-space:nowrap}
table.dt th:first-child,table.dt td:first-child{text-align:left;white-space:normal;min-width:34%}
table.dt th{font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);font-weight:650}
table.dt td b{font-weight:650}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.meter{height:9px;border-radius:4px;background:var(--grid);overflow:hidden;margin-top:9px}
.meter i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--seq-400)}

/* ---------- slicer ---------- */
.slicer{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 13px 13px;margin-bottom:12px}
.slicer-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.slicer-head span{font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}
.slicer-all{font-variant-numeric:tabular-nums}
.slicer .filters{margin-bottom:0}
.linkbtn{font-size:12.5px;font-weight:650;color:var(--accent);padding:2px 0;min-height:24px}

/* ---------- charts ---------- */
.chart-wide{display:block}
.chart-host{margin:2px 0 4px;display:flex;flex-direction:column;align-items:center}
svg.radar,svg.barchart{display:block;max-width:100%;overflow:visible;touch-action:manipulation}
svg.barchart{align-self:stretch}
.wedge{cursor:pointer}
[data-cat]{cursor:pointer}
[data-cat]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.radarkey{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;width:100%}
.radarkey li{display:flex;gap:7px;align-items:baseline;font-size:11.5px;color:var(--text-secondary);line-height:1.3;padding:2px 0;cursor:pointer}
.radarkey li b{flex:none;min-width:14px;font-variant-numeric:tabular-nums;color:var(--text-muted);font-weight:650}
.radarkey li.on{color:var(--text-primary);font-weight:600}
.radarkey li.on b{color:var(--accent)}
.readout{border-top:1px solid var(--grid);margin-top:10px;padding-top:11px}
.readout.muted{font-size:12.5px;color:var(--text-muted);text-align:center;padding-top:10px}
.ro-name{font-size:14px;font-weight:650;line-height:1.3;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.ro-area{font-size:11.5px;font-weight:500;color:var(--text-muted)}
.ro-vals{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:7px;font-size:12.5px;color:var(--text-secondary)}
.ro-vals span{display:inline-flex;align-items:center;gap:6px}
.ro-vals b{font-size:15px;font-weight:680;color:var(--text-primary);font-variant-numeric:tabular-nums}
.ro-n{color:var(--text-muted);font-variant-numeric:tabular-nums}

/* ---------- scale reference / settings ---------- */
.scalelist{display:flex;flex-direction:column;gap:1px}
.scaleitem{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--grid)}
.scaleitem:last-child{border-bottom:0}
.scaleitem .n{
  width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;
  font-size:13px;font-weight:650;color:var(--text-primary);font-variant-numeric:tabular-nums;
  border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)
}
.scaleitem .d{flex:1;min-width:0}
.scaleitem .d strong{display:block;font-size:14px;font-weight:600}
.scaleitem .d span{font-size:12.5px;color:var(--text-muted);line-height:1.35;display:block;margin-top:1px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px}
.field input,.field select{width:100%;min-height:42px;padding:0 11px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-2)}
.btnrow{display:flex;flex-direction:column;gap:9px}
.bigbtn{
  width:100%;min-height:46px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface-2);
  font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:9px
}
.bigbtn:active{background:var(--surface-0)}
.bigbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.bigbtn.danger{color:var(--critical);border-color:color-mix(in srgb,var(--critical) 40%,transparent)}
.help{font-size:13px;color:var(--text-secondary);line-height:1.5}
.help ol{margin:8px 0 0;padding-left:20px} .help li{margin-bottom:5px}
.empty{text-align:center;padding:34px 18px;color:var(--text-muted)}
.empty .big{font-size:15px;font-weight:600;color:var(--text-secondary);margin-bottom:5px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(78px + env(safe-area-inset-bottom));z-index:200;
  background:var(--text-primary);color:var(--surface-1);padding:10px 17px;border-radius:11px;

DATA.areas.forEach(a => { AREA_BY_ID[a.id] = a; });
const TOTAL_Q = DATA.areas.reduce((n, a) => n + a.questions.length, 0);

/* ---------- storage (degrades to memory if unavailable) ---------- */
const store = (() => {
  let ok = false, mem = null;
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); ok = true; } catch (e) { ok = false; }
  return {
    persistent: ok,
    get() { try { return ok ? localStorage.getItem(KEY) : mem; } catch (e) { return mem; } },
    set(v) { try { ok ? localStorage.setItem(KEY, v) : (mem = v); } catch (e) { mem = v; } },
    del() { try { ok ? localStorage.removeItem(KEY) : (mem = null); } catch (e) { mem = null; } }
  };
})();

function seedFromWorkbook() {
  const r = {};
  DATA.areas.forEach(a => a.questions.forEach((q, i) => {
    if (q.sa == null && q.ea == null && !q.sac && !q.eac) return;
    r[a.id + "|" + i] = { sa: q.sa, ea: q.ea, sac: q.sac || "", eac: q.eac || "" };
  }));
  return r;
}
let state = {
  client: DATA.client || "",
  assessor: "",
  lane: "self",
  responses: seedFromWorkbook(),
  theme: "auto",
  seeded: true
};
(function load() {
  const raw = store.get();
  if (!raw) return;
  try {
    const s = JSON.parse(raw);
    if (s && typeof s === "object") state = Object.assign(state, s);
  } catch (e) { /* keep defaults */ }
})();
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store.set(JSON.stringify(state)), 220);
}

/* ---------- ui state ---------- */
const ui = { tab: "assess", area: null, dashArea: null, filter: "all", query: "", open: {}, showTable: false,
             areaFilter: [], level: "area", pick: null };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const resp = (aid, i) => state.responses[aid + "|" + i] || null;
function setResp(aid, i, patch) {
  const k = aid + "|" + i;
  state.responses[k] = Object.assign({ sa: null, ea: null, sac: "", eac: "" }, state.responses[k], patch);
  save();
}
const val = (aid, i, lane) => { const r = resp(aid, i); return r ? (lane === "self" ? r.sa : r.ea) : null; };
const cmt = (aid, i, lane) => { const r = resp(aid, i); return r ? (lane === "self" ? (r.sac || "") : (r.eac || "")) : ""; };
const laneName = l => l === "self" ? "Self assessment" : "External assessment";
const fmt = n => n == null ? "—" : (Math.round(n * 10) / 10).toFixed(1);

function stats(qs, aid) {
  const sa = [], ea = []; let both = 0;
  qs.forEach((q, i) => {
    const idx = q.__i != null ? q.__i : i;
    const s = val(aid, idx, "self"), e = val(aid, idx, "external");
    if (s != null) sa.push(s);
    if (e != null) ea.push(e);
    if (s != null && e != null) both++;
  });
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return { n: qs.length, saN: sa.length, eaN: ea.length, both, sa: avg(sa), ea: avg(ea), gap: (avg(ea) != null && avg(sa) != null) ? avg(ea) - avg(sa) : null };
}
const areaStats = a => stats(a.questions.map((q, i) => (q.__i = i, q)), a.id);

function subjectsOf(a) {
  const m = new Map();
  a.questions.forEach((q, i) => {
    if (!m.has(q.subject)) m.set(q.subject, []);
    m.get(q.subject).push(Object.assign({}, q, { __i: i }));
  });
  return [...m.entries()].map(([name, qs]) => ({ name, qs }));
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t.__t); t.__t = setTimeout(() => t.classList.remove("show"), 1900);
}
function pctLabel(done, total) {
  if (!total) return 0;
  const p = (done / total) * 100;
  return done >= total ? 100 : Math.min(99, Math.round(p));
}
function ring(pct, size, done, total) {
  const sz = size || 46, r = (sz - 6) / 2, c = 2 * Math.PI * r;
  return `<div class="ring"><svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" aria-hidden="true">
    <circle cx="${sz / 2}" cy="${sz / 2}" r="${r}" fill="none" stroke="var(--grid)" stroke-width="4"/>
    <circle cx="${sz / 2}" cy="${sz / 2}" r="${r}" fill="none" stroke="var(--seq-400)" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - pct)).toFixed(1)}"/>
  </svg><div class="pct">${done != null ? pctLabel(done, total) : Math.round(pct * 100)}%</div></div>`;
}
function gapChip(g) {
  if (g == null) return `<span class="gapchip flat">n/a</span>`;
  const r = Math.round(g * 10) / 10;
  if (Math.abs(r) < 0.05) return `<span class="gapchip flat">&#9644; aligned</span>`;
  return r > 0
    ? `<span class="gapchip over">&#9650; ext +${r.toFixed(1)}</span>`
    : `<span class="gapchip under">&#9660; ext ${r.toFixed(1)}</span>`;
}

/* ============================================================
   ASSESS
   ============================================================ */
function renderAssess() {
  const v = $("#view-assess");
  if (!ui.area) { v.innerHTML = areaListHTML(); return; }
  v.innerHTML = areaDetailHTML(AREA_BY_ID[ui.area]);
}

function areaListHTML() {
  let sa = [], ea = [];
  DATA.areas.forEach(a => a.questions.forEach((q, i) => {
    const s = val(a.id, i, "self"), e = val(a.id, i, "external");
    if (s != null) sa.push(s); if (e != null) ea.push(e);
  }));
  const avg = x => x.length ? x.reduce((p, c) => p + c, 0) / x.length : null;
  const laneDone = state.lane === "self" ? sa.length : ea.length;

  return `
  <div class="card tight">
    <div class="card-title">${esc(state.client || "Unnamed client")}</div>
    <div style="display:flex;align-items:center;gap:14px;margin-top:9px">
      ${ring(laneDone / TOTAL_Q, 52, laneDone, TOTAL_Q)}
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600">${laneDone} of ${TOTAL_Q} scored</div>
        <div style="font-size:12.5px;color:var(--text-muted);margin-top:2px">${esc(laneName(state.lane))} &middot; ${DATA.areas.length} areas</div>
      </div>
      <div style="text-align:right;flex:none">
        <div style="font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);font-weight:650">Avg</div>
        <div style="font-size:22px;font-weight:680;font-variant-numeric:tabular-nums;line-height:1.1">${fmt(state.lane === "self" ? avg(sa) : avg(ea))}</div>
      </div>
    </div>
  </div>
  ${laneSwitchHTML()}
  <div class="section-label">Assessment areas</div>
  <div class="arealist">
    ${DATA.areas.map(a => {
      const st = areaStats(a);
      const done = state.lane === "self" ? st.saN : st.eaN;
      const mine = state.lane === "self" ? st.sa : st.ea;
      return `<button class="arearow" data-area="${a.id}">
        ${ring(done / st.n, 46, done, st.n)}
        <div class="meta">
          <div class="nm">${esc(a.name)}</div>
          <div class="dt"><span>${done}/${st.n} scored</span><span>&middot;</span><span>avg ${fmt(mine)}</span></div>
        </div>
        <div class="chev">&#8250;</div>
      </button>`;
    }).join("")}
  </div>`;
}

function laneSwitchHTML() {
  return `<div class="lanes" role="group" aria-label="Which assessment am I completing">
    <button data-lane="self" aria-pressed="${state.lane === "self"}"><i class="swatch sw1"></i>Self</button>
    <button data-lane="external" aria-pressed="${state.lane === "external"}"><i class="swatch sw2"></i>External</button>
  </div>`;
}

function matches(q, aid, i) {
  if (ui.query) {
    const t = (q.q + " " + q.subject).toLowerCase();
    if (!ui.query.toLowerCase().split(/\s+/).every(w => t.includes(w))) return false;
  }
  const v = val(aid, i, state.lane);
  if (ui.filter === "todo" && v != null) return false;
  if (ui.filter === "done" && v == null) return false;
  if (ui.filter === "gap") {
    const s = val(aid, i, "self"), e = val(aid, i, "external");
    if (s == null || e == null || Math.abs(e - s) < 2) return false;
  }
  return true;
}

function areaDetailHTML(a) {
  const st = areaStats(a);
  const done = state.lane === "self" ? st.saN : st.eaN;
  const flat = ui.query || ui.filter !== "all";
  const subs = subjectsOf(a);
  const shown = subs.map(s => ({ name: s.name, qs: s.qs.filter(q => matches(q, a.id, q.__i)) })).filter(s => s.qs.length);
  const nShown = shown.reduce((n, s) => n + s.qs.length, 0);

  return `
  ${laneSwitchHTML()}
  <div class="card tight">
    <div style="display:flex;align-items:center;gap:13px">
      ${ring(done / st.n, 46, done, st.n)}
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600">${done}/${st.n} scored &middot; avg ${fmt(state.lane === "self" ? st.sa : st.ea)}</div>
        <div style="font-size:12.5px;color:var(--text-muted);margin-top:2px">${subs.length} subject areas</div>
      </div>
      ${st.both ? gapChip(st.gap) : ""}
    </div>
  </div>
  <div class="searchwrap">
    <input type="search" id="qsearch" placeholder="Search questions" value="${esc(ui.query)}" enterkeyhint="search" autocapitalize="none">
    ${ui.query ? `<button class="clr" id="qclear" aria-label="Clear search">&#10005;</button>` : ""}
  </div>
  <div class="filters">
    <button class="chip" data-filter="all" aria-pressed="${ui.filter === "all"}">All ${st.n}</button>
    <button class="chip" data-filter="todo" aria-pressed="${ui.filter === "todo"}">Unanswered ${st.n - done}</button>
    <button class="chip" data-filter="done" aria-pressed="${ui.filter === "done"}">Answered ${done}</button>
    <button class="chip" data-filter="gap" aria-pressed="${ui.filter === "gap"}">Gap &ge; 2</button>
  </div>
  ${nShown === 0
    ? `<div class="empty"><div class="big">Nothing to show</div><div>No questions match this filter or search.</div></div>`
    : shown.map(s => {
      const key = a.id + "::" + s.name;
      const open = flat ? true : !!ui.open[key];
      const sdone = s.qs.filter(q => val(a.id, q.__i, state.lane) != null).length;
      const sst = stats(s.qs, a.id);
      return `<div class="subjgroup">
        <button class="subjhead" data-subj="${esc(key)}" aria-expanded="${open}">
          <span class="caret">&#9654;</span>
          <span class="nm">${esc(s.name)}</span>
          <span class="cnt">${sdone}/${s.qs.length}</span>
          <span class="dualpair" aria-hidden="true">
            <span class="${sst.sa != null ? "d1" : "dn"}">${sst.sa != null ? fmt(sst.sa) : "–"}</span>
            <span class="${sst.ea != null ? "d2" : "dn"}">${sst.ea != null ? fmt(sst.ea) : "–"}</span>
          </span>
        </button>
        <div class="subjbody" ${open ? "" : "hidden"}>${s.qs.map(q => qCardHTML(a, q)).join("")}</div>
      </div>`;
    }).join("")}`;
}

function qCardHTML(a, q) {
  const i = q.__i, mine = val(a.id, i, state.lane), other = state.lane === "self" ? "external" : "self";
  const otherV = val(a.id, i, other), myC = cmt(a.id, i, state.lane), otherC = cmt(a.id, i, other);
  const lvl = mine != null ? LEVELS[mine - 1] : null;
  return `<div class="qcard lane-${state.lane}" data-q="${a.id}|${i}" id="q-${a.id}-${i}">
    <span class="subjtag">${esc(q.subject)}</span>
    <div class="qhead"><span class="qnum">Q${i + 1}</span><div class="qtext">${esc(q.q)}</div></div>
    <div class="scale" role="group" aria-label="${esc(laneName(state.lane))} score, 1 to 8">
      ${LEVELS.map((L, k) => `<button data-score="${k + 1}" aria-pressed="${mine === k + 1}" aria-label="${k + 1} — ${esc(L[0])}">${k + 1}</button>`).join("")}
    </div>
    <div class="scalefoot">
      <div class="levelname ${lvl ? "" : "empty"}">${lvl ? esc(mine + " · " + lvl[0]) : "Not yet scored"}</div>
      ${otherV != null ? `<div class="otherlane"><i class="swatch ${other === "self" ? "sw1" : "sw2"}"></i>${other === "self" ? "Self" : "External"} ${otherV}</div>` : ""}
    </div>
    <div class="qactions">
      <button class="minibtn ${myC ? "on" : ""}" data-act="comment">&#9998; ${myC ? "Edit note" : "Add note"}</button>
      ${mine != null ? `<button class="minibtn" data-act="clear">Clear score</button>` : ""}
    </div>
    <div class="cmtwrap" hidden>
      <label>${esc(laneName(state.lane))} comments</label>
      <textarea data-cmt placeholder="Evidence, rationale, objectives…">${esc(myC)}</textarea>
      <div class="qactions"><button class="minibtn" data-act="savecmt">Save note</button><button class="minibtn" data-act="cancelcmt">Cancel</button></div>
    </div>
    ${myC ? `<div class="savedcmt"><b>${esc(state.lane === "self" ? "Self note" : "External note")}</b>${esc(myC)}</div>` : ""}
    ${otherC ? `<div class="savedcmt"><b>${esc(other === "self" ? "Self note" : "External note")}</b>${esc(otherC)}</div>` : ""}
  </div>`;
}
/* ============================================================
   DASHBOARD — charts, slicer filters, gap analysis
   Mirrors the workbook Dashboard: a radar and a grouped bar of
   Self vs External, driven by an Assessment Area slicer, at either
   area or subject level (the workbook's two pivot levels).
   ============================================================ */
const MAXS = 8;

/* ---------- slicer ---------- */
function activeAreas() {
  const sel = ui.areaFilter;
  if (!sel || !sel.length) return DATA.areas;
  const set = new Set(sel);
  const hit = DATA.areas.filter(a => set.has(a.id));
  return hit.length ? hit : DATA.areas;
}

/* ---------- category rollups ---------- */
function chartCats() {
  const areas = activeAreas();
  if (ui.level === "subject") {
    const out = [];
    areas.forEach(a => subjectsOf(a).forEach(s => {
      out.push({ key: a.id + "::" + s.name, name: s.name, area: a.name, aid: a.id, st: stats(s.qs, a.id) });
    }));
    return out;
  }
  return areas.map(a => ({ key: a.id, name: a.name, area: a.name, aid: a.id, st: areaStats(a) }));
}

function filteredQuestions() {
  const out = [];
  activeAreas().forEach(a => a.questions.forEach((q, i) => out.push({ a, q, i })));
  return out;
}

function overallStats() {
  const sa = [], ea = [];
  let both = 0, n = 0;
  filteredQuestions().forEach(({ a, i }) => {
    n++;
    const s = val(a.id, i, "self"), e = val(a.id, i, "external");
    if (s != null) sa.push(s);
    if (e != null) ea.push(e);
    if (s != null && e != null) both++;
  });
  const avg = x => x.length ? x.reduce((p, c) => p + c, 0) / x.length : null;
  const oSa = avg(sa), oEa = avg(ea);
  return { n, saN: sa.length, eaN: ea.length, both, sa: oSa, ea: oEa, gap: (oSa != null && oEa != null) ? oEa - oSa : null };
}

const svgEsc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const short = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;

/* Radar spokes have little horizontal room, so shorten the long standard words
   and wrap what's left over two lines rather than truncating mid-word. */
const ABBR = [[/\bManagement\b/g, "Mgmt"], [/\bProgramme\b/g, "Prog"], [/\bAssessment\b/g, "Assmt"],
              [/\bContinuous\b/g, "Cont."], [/\bCommunication\b/g, "Comms"], [/\bImprovement\b/g, "Improv."]];
function chartLabel(s) {
  let t = String(s);
  ABBR.forEach(([re, to]) => { t = t.replace(re, to); });
  return t;
}
function wrapLabel(s, maxChars, maxLines) {
  const words = chartLabel(s).split(/\s+/);
  const lines = [];
  let cur = "";
  for (const w of words) {
    const next = cur ? cur + " " + w : w;
    if (next.length <= maxChars || !cur) { cur = next; continue; }
    lines.push(cur); cur = w;
    if (lines.length === maxLines - 1) break;
  }
  if (cur && lines.length < maxLines) lines.push(cur);
  const used = lines.join(" ").length;
  const total = chartLabel(s).length;
  if (used < total) lines[lines.length - 1] = short(lines[lines.length - 1] + "…", maxChars + 1);
  return lines;
}

/* ============================================================
   RADAR
   ============================================================ */
/* Spoke labels only fit when the plot is wide. On a phone the numbered key
   below the radar is clearer than seven truncated names crowding the edge. */
const numberedFor = N => N > 8 || window.innerWidth < 480;

function radarSVG(cats, W) {
  const N = cats.length;
  if (!N) return "";
  const size = Math.min(W, 520);
  const R = (size - (numberedFor(N) ? 62 : 108)) / 2;
  const cx = size / 2, cy = size / 2;
  const numbered = numberedFor(N);              // long label sets get a numbered key instead
  const angle = i => (-90 + i * 360 / N) * Math.PI / 180;
  const pt = (i, v) => {
    const a = angle(i), r = R * (v / MAXS);
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  let g = "";

  // rings + scale labels
  [2, 4, 6, 8].forEach(v => {
    const pts = [];
    for (let i = 0; i < N; i++) pts.push(pt(i, v).map(n => n.toFixed(1)).join(","));
    g += `<polygon points="${pts.join(" ")}" fill="none" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${(cx + 5).toFixed(1)}" y="${(cy - R * (v / MAXS) + 3.5).toFixed(1)}" font-size="9.5" fill="var(--text-muted)" font-family="inherit">${v}</text>`;
  });

  // spokes + category labels
  for (let i = 0; i < N; i++) {
    const [x, y] = pt(i, MAXS);
    g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    const a = angle(i), lx = cx + (R + 13) * Math.cos(a), ly = cy + (R + 13) * Math.sin(a);
    const cos = Math.cos(a);
    const anchor = Math.abs(cos) < 0.25 ? "middle" : (cos > 0 ? "start" : "end");
    const on = ui.pick === cats[i].key;
    const lines = numbered ? [String(i + 1)] : wrapLabel(cats[i].name, size < 400 ? 13 : 17, 2);
    const y0 = ly + 3.5 - (lines.length - 1) * 5.5;
    g += `<text x="${lx.toFixed(1)}" y="${y0.toFixed(1)}" text-anchor="${anchor}" font-size="${numbered ? 11.5 : 10.5}"
      font-weight="${on ? 700 : 500}" fill="${on ? "var(--text-primary)" : "var(--text-secondary)"}"
      font-family="inherit">${lines.map((ln, k) => `<tspan x="${lx.toFixed(1)}" dy="${k ? 11 : 0}">${svgEsc(ln)}</tspan>`).join("")}</text>`;
  }

  // series — self drawn first so external reads on top
  [["sa", "var(--series-1)"], ["ea", "var(--series-2)"]].forEach(([k, col]) => {
    if (cats.every(c => c.st[k] == null)) return;
    const pts = cats.map((c, i) => pt(i, c.st[k] == null ? 0 : c.st[k]));
    g += `<polygon points="${pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}"
      fill="${col}" fill-opacity="0.10" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach((p, i) => {
      if (cats[i].st[k] == null) return;
      g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${ui.pick === cats[i].key ? 5.5 : 4}"
        fill="${col}" stroke="var(--surface-1)" stroke-width="2"/>`;
    });
  });

  // transparent tap wedges — the hit area is the whole sector, not the 8px dot
  for (let i = 0; i < N; i++) {
    const a0 = angle(i) - Math.PI / N, a1 = angle(i) + Math.PI / N;
    const p0 = [cx + (R + 20) * Math.cos(a0), cy + (R + 20) * Math.sin(a0)];
    const p1 = [cx + (R + 20) * Math.cos(a1), cy + (R + 20) * Math.sin(a1)];
    g += `<polygon class="wedge" points="${cx},${cy} ${p0.map(n => n.toFixed(1)).join(",")} ${p1.map(n => n.toFixed(1)).join(",")}"
      fill="transparent" data-cat="${svgEsc(cats[i].key)}" tabindex="0" role="button"
      aria-label="${svgEsc(cats[i].name)}: self ${fmt(cats[i].st.sa)}, external ${fmt(cats[i].st.ea)}"/>`;
  }

  return `<svg class="radar" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img"
    aria-label="Radar chart comparing self and external maturity across ${N} categories">${g}</svg>`;
}

function radarKeyHTML(cats) {
  if (!numberedFor(cats.length)) return "";
  return `<ol class="radarkey">${cats.map((c, i) =>
    `<li data-cat="${esc(c.key)}" class="${ui.pick === c.key ? "on" : ""}"><b>${i + 1}</b><span>${esc(c.name)}</span></li>`).join("")}</ol>`;
}

/* ============================================================
   GROUPED BAR
   ============================================================ */
function barsSVG(cats, W) {
  const N = cats.length;
  if (!N) return "";
  const gutter = 36, rowH = 50, top = 6, axisH = 20;
  const plotW = W - gutter;
  const H = top + N * rowH + axisH;
  const x = v => (v == null ? 0 : (v / MAXS) * plotW);
  let g = "";

  cats.forEach((c, i) => {
    if (ui.pick !== c.key) return;
    g += `<rect x="-8" y="${top + i * rowH - 2}" width="${W + 10}" height="${rowH - 2}" rx="8" fill="var(--surface-0)"/>`;
  });

  [0, 2, 4, 6, 8].forEach(v => {
    const gx = x(v).toFixed(1);
    g += `<line x1="${gx}" y1="${top}" x2="${gx}" y2="${top + N * rowH - 6}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${gx}" y="${H - 5}" font-size="10" fill="var(--text-muted)" font-family="inherit"
      text-anchor="${v === 0 ? "start" : v === MAXS ? "end" : "middle"}">${v}</text>`;
  });

  cats.forEach((c, i) => {
    const y0 = top + i * rowH;
    const on = ui.pick === c.key;
    g += `<text x="0" y="${y0 + 12}" font-size="12.5" font-weight="${on ? 700 : 600}" fill="var(--text-primary)"
      font-family="inherit">${svgEsc(short(c.name, Math.max(18, Math.floor(W / 7.6))))}</text>`;

    // two 11px bars, 2px surface gap between them, 4px rounded data-end
    [["sa", "var(--series-1)"], ["ea", "var(--series-2)"]].forEach(([k, col], j) => {
      const v = c.st[k], by = y0 + 19 + j * 13;
      if (v == null) {
        if (j === 0) g += `<text x="0" y="${by + 17}" font-size="10.5" fill="var(--text-muted)" font-family="inherit">not scored</text>`;
        return;
      }
      const w = Math.max(4, x(v));
      g += `<path d="M0 ${by} H${(w - 4).toFixed(1)} a4 4 0 0 1 4 4 v3 a4 4 0 0 1 -4 4 H0 Z" fill="${col}"/>`;
      g += `<text x="${(w + 6).toFixed(1)}" y="${by + 9}" font-size="11" font-weight="650"
        fill="var(--text-secondary)" font-family="inherit">${fmt(v)}</text>`;
    });

    g += `<rect x="-8" y="${y0 - 2}" width="${W + 10}" height="${rowH - 2}" fill="transparent"
      data-cat="${svgEsc(c.key)}" tabindex="0" role="button"
      aria-label="${svgEsc(c.name)}: self ${fmt(c.st.sa)}, external ${fmt(c.st.ea)}"/>`;
  });

  return `<svg class="barchart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    aria-label="Grouped bar chart comparing self and external maturity across ${N} categories">${g}</svg>`;
}

/* ---------- export ---------- */
function csvCell(v) {
  const s = v == null ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function buildCSV() {
  const rows = [["Client", "Assessor", "Assessment Area", "Assessment Subject", "Question",
    "Self Assessment", "External Assessment", "Gap (Ext-Self)", "Self Assessment Comments", "External Assessment Comments"]];
  DATA.areas.forEach(a => a.questions.forEach((q, i) => {
    const s = val(a.id, i, "self"), e = val(a.id, i, "external");
    rows.push([state.client, state.assessor, a.name, q.subject, q.q, s == null ? "" : s, e == null ? "" : e,
      (s != null && e != null) ? e - s : "", cmt(a.id, i, "self"), cmt(a.id, i, "external")]);
  }));
  return "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
}
function slug(s) { return (s || "assessment").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "assessment"; }
function stamp() { const d = new Date(); const p = n => String(n).padStart(2, "0"); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()); }
const INSTALLED = (() => {
  try {
    return window.navigator.standalone === true ||
           (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  } catch (e) { return false; }
})();
const NATIVE = (() => {
  try { return !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.cvmExport); }
  catch (e) { return false; }
})();
function haptic(kind) {
  try { window.webkit.messageHandlers.cvmHaptic.postMessage(kind || "light"); } catch (e) { /* web: no-op */ }
}
async function download(text, filename, mime) {
  if (NATIVE) {
    try {
      window.webkit.messageHandlers.cvmExport.postMessage({ name: filename, mime: mime, text: text });
      return;
    } catch (e) { /* fall through to web paths */ }
  }
  const blob = new Blob([text], { type: mime });
  try {
    const file = new File([blob], filename, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Saved " + filename);
}

function chrome() {
  const inArea = ui.tab === "assess" && ui.area, inDashArea = false;
  $("#backBtn").hidden = !(inArea || inDashArea);
  $("#fabrow").hidden = !inArea;
  document.body.classList.toggle("has-fab", !!inArea);
  const t = $("#title"), s = $("#subtitle");
  if (inArea) { t.textContent = AREA_BY_ID[ui.area].name; s.textContent = laneName(state.lane) + " · " + (state.client || "no client"); }
  else if (inDashArea) { t.textContent = AREA_BY_ID[ui.dashArea].name; s.textContent = "Self vs external by subject"; }
  else if (ui.tab === "dash") { t.textContent = "Dashboard"; s.textContent = state.client || "Comparison analysis"; }
  else if (ui.tab === "more") { t.textContent = "Setup"; s.textContent = "Details, export, scale"; }
  else { t.textContent = "CVM Maturity"; s.textContent = "Contract Value Management assessment"; }
  document.querySelectorAll("#tabbar button").forEach(b => {
    if (b.dataset.tab === ui.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  ["assess", "dash", "more"].forEach(k => { $("#view-" + k).hidden = ui.tab !== k; });
}
function render(keepScroll) {
  const y = window.scrollY;
  // chrome() first: it unhides the target view, so charts can measure a real
  // container width instead of 0 (a hidden element has no layout).
  chrome();
  if (ui.tab === "assess") renderAssess();
  else if (ui.tab === "dash") renderDash();
  else renderMore();
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
}

/* theme */
function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.theme);
  const icons = {
    auto: '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 000 16z" fill="currentColor" stroke="none"/></svg>',
    light: '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/></svg>',
    dark: '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.2 8.2 0 019.5 4 8.4 8.4 0 1020 14.5z"/></svg>'
  };
  $("#themeBtn").innerHTML = icons[state.theme] || icons.auto;
  $("#themeBtn").title = "Appearance: " + state.theme;
  $("#themeBtn").setAttribute("aria-label", "Appearance: " + state.theme + ". Tap to change.");
}
$("#themeBtn").addEventListener("click", () => {
  state.theme = state.theme === "auto" ? "light" : state.theme === "light" ? "dark" : "auto";
  applyTheme(); save(); toast("Appearance: " + state.theme);
});

$("#tabbar").addEventListener("click", e => {

  ui.tab = b.dataset.tab; render();
});
$("#backBtn").addEventListener("click", () => {
  if (ui.tab === "assess") { ui.area = null; ui.query = ""; ui.filter = "all"; }
  else ui.dashArea = null;
  render();
});

function gotoQuestion(aid, i) {
  ui.tab = "assess"; ui.area = aid; ui.filter = "all"; ui.query = "";
  const q = AREA_BY_ID[aid].questions[i];
  ui.open[aid + "::" + q.subject] = true;
  render();
  requestAnimationFrame(() => {
    const el = document.getElementById("q-" + aid + "-" + i);
    if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.style.outline = "2px solid var(--accent)"; el.style.outlineOffset = "2px"; setTimeout(() => { el.style.outline = ""; }, 1600); }
  });
}

document.querySelector("main").addEventListener("click", e => {
  const t = e.target;

  const lane = t.closest("[data-lane]");
  if (lane) { state.lane = lane.dataset.lane; haptic("light"); save(); render(true); return; }

  const arow = t.closest("[data-area]");
  if (arow) { ui.area = arow.dataset.area; ui.filter = "all"; ui.query = ""; render(); return; }

  const slice = t.closest("[data-slice]");
  if (slice) {
    const id = slice.dataset.slice;
    if (id === "__clear") ui.areaFilter = [];
    else {
      const set = new Set(ui.areaFilter || []);
      set.has(id) ? set.delete(id) : set.add(id);
      ui.areaFilter = [...set];
    }
    ui.pick = null; haptic("light"); render(true); return;
  }

  const lvl = t.closest("[data-level]");
  if (lvl) { ui.level = lvl.dataset.level; ui.pick = null; haptic("light"); render(true); return; }

  const drill = t.closest("[data-drill]");
  if (drill) { ui.areaFilter = [drill.dataset.drill]; ui.level = "subject"; ui.pick = null; haptic("light"); render(); return; }

  const oa = t.closest("[data-openarea]");
  if (oa) { ui.tab = "assess"; ui.area = oa.dataset.openarea; render(); return; }

  const cat = t.closest("[data-cat]");
  if (cat) {
    const k = cat.dataset.cat;
    ui.pick = ui.pick === k ? null : k;
    haptic("light"); render(true); return;
  }

  const openA = t.closest("[data-open-area]");
  if (openA) { ui.tab = "assess"; ui.area = openA.dataset.openArea; ui.dashArea = null; render(); return; }

  const goto = t.closest("[data-goto]");
  if (goto) { const [aid, i] = goto.dataset.goto.split("|"); gotoQuestion(aid, +i); return; }

  const subj = t.closest("[data-subj]");
  if (subj) {
    const k = subj.dataset.subj; ui.open[k] = !ui.open[k];
    subj.setAttribute("aria-expanded", String(!!ui.open[k]));
    subj.parentElement.querySelector(".subjbody").hidden = !ui.open[k];
    return;
  }

  const f = t.closest("[data-filter]");
  if (f) { ui.filter = f.dataset.filter; render(true); return; }

  if (t.closest("#qclear")) { ui.query = ""; render(true); return; }

  const sc = t.closest("[data-score]");
  if (sc) {
    const card = sc.closest(".qcard"), [aid, i] = card.dataset.q.split("|");
    const n = +sc.dataset.score, cur = val(aid, +i, state.lane);
    setResp(aid, +i, state.lane === "self" ? { sa: n === cur ? null : n } : { ea: n === cur ? null : n });
    haptic(n === cur ? "soft" : "light");
    refreshCard(card, aid, +i);
    return;
  }

  const act = t.closest("[data-act]");
  if (act) { handleAct(act.dataset.act, act); return; }
});

function refreshCard(card, aid, i) {
  const a = AREA_BY_ID[aid], q = Object.assign({}, a.questions[i], { __i: i });
  const tmp = document.createElement("div");
  tmp.innerHTML = qCardHTML(a, q);
  card.replaceWith(tmp.firstElementChild);
}

function handleAct(act, el) {
  const card = el.closest(".qcard");
  if (card) {
    const [aid, iS] = card.dataset.q.split("|"), i = +iS;
    if (act === "comment") { const w = card.querySelector(".cmtwrap"); w.hidden = !w.hidden; if (!w.hidden) card.querySelector("textarea").focus(); return; }
    if (act === "cancelcmt") { card.querySelector(".cmtwrap").hidden = true; return; }
    if (act === "savecmt") {
      const txt = card.querySelector("textarea").value.trim();
      setResp(aid, i, state.lane === "self" ? { sac: txt } : { eac: txt });
      refreshCard(card, aid, i); toast("Note saved"); return;
    }
    if (act === "clear") {
      setResp(aid, i, state.lane === "self" ? { sa: null } : { ea: null });
      refreshCard(card, aid, i); return;
    }
  }
  if (act === "toggletable") { ui.showTable = !ui.showTable; render(true); return; }
  if (act === "csv") { download(buildCSV(), "cvm-assessment-" + slug(state.client) + "-" + stamp() + ".csv", "text/csv;charset=utf-8"); return; }
  if (act === "json") {
    download(JSON.stringify({ app: "cvm-assess", version: 1, exported: new Date().toISOString(), state }, null, 2),
      "cvm-assessment-" + slug(state.client) + "-" + stamp() + ".json", "application/json");
    return;
  }
  if (act === "import") { $("#fileIn").click(); return; }
  if (act === "blank") {
    if (!confirm("Clear all scores and notes and start a blank assessment?")) return;
    state.responses = {}; state.seeded = false; save(); toast("Blank assessment started"); render(); return;
  }
  if (act === "reseed") {
    if (!confirm("Reload the scores and notes from the workbook? This replaces current answers.")) return;
    state.responses = seedFromWorkbook(); state.seeded = true; save(); toast("Workbook data reloaded"); render(); return;
  }
}

document.querySelector("main").addEventListener("input", e => {
  if (e.target.id === "qsearch") {
    clearTimeout(window.__st);
    const v = e.target.value;
    window.__st = setTimeout(() => { ui.query = v; render(true); const s = $("#qsearch"); if (s) { s.focus(); s.setSelectionRange(v.length, v.length); } }, 260);
  }
});
document.querySelector("main").addEventListener("change", e => {
  if (e.target.id === "fClient") { state.client = e.target.value.trim(); save(); chrome(); }
  if (e.target.id === "fAssessor") { state.assessor = e.target.value.trim(); save(); }
  if (e.target.id === "fLane") { state.lane = e.target.value; save(); toast("Now completing: " + laneName(state.lane)); }
});
document.querySelector("main").addEventListener("blur", e => {
  if (e.target.matches("textarea[data-cmt]")) {
    const card = e.target.closest(".qcard"); if (!card) return;
    const [aid, iS] = card.dataset.q.split("|"), i = +iS, txt = e.target.value.trim();
    if (txt !== cmt(aid, i, state.lane)) setResp(aid, i, state.lane === "self" ? { sac: txt } : { eac: txt });
  }
}, true);

$("#fileIn").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result), s = o && o.state ? o.state : o;
      if (!s || typeof s.responses !== "object") throw 0;
      state = Object.assign(state, s); save(); applyTheme(); render();
      toast("Backup restored");
    } catch (err) { alert("That file could not be read as a CVM assessment backup."); }
    e.target.value = "";
  };
  r.readAsText(f);
});

/* FAB: jump between unanswered */
function unansweredIdx(aid) {
  return AREA_BY_ID[aid].questions.map((q, i) => i).filter(i => val(aid, i, state.lane) == null);
}
$("#fabNext").addEventListener("click", () => {
  if (!ui.area) return;
  const list = unansweredIdx(ui.area);
  if (!list.length) { toast("All " + AREA_BY_ID[ui.area].questions.length + " questions scored"); return; }
  const y = window.scrollY;
  let target = list[0];
  for (const i of list) {
    const el = document.getElementById("q-" + ui.area + "-" + i);
    if (el && el.getBoundingClientRect().top > 90) { target = i; break; }
  }
  gotoQuestion(ui.area, target);
  window.scrollTo(0, y);
  requestAnimationFrame(() => {
    const el = document.getElementById("q-" + ui.area + "-" + target);
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
  });
});
$("#fabPrev").addEventListener("click", () => {
  if (!ui.area) return;
  const aid = ui.area;
  const list = AREA_BY_ID[aid].questions.map((q, i) => {
    const s = val(aid, i, "self"), e = val(aid, i, "external");
    return (s != null && e != null) ? { i, g: Math.abs(e - s) } : null;
  }).filter(Boolean).sort((a, b) => b.g - a.g);
  if (!list.length || list[0].g === 0) { toast("No self vs external gaps in this area"); return; }
  gotoQuestion(aid, list[0].i);
});

/* SVG marks are focusable buttons — Enter/Space must act like a tap. */
document.querySelector("main").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const cat = e.target.closest && e.target.closest("[data-cat]");
  if (!cat) return;
  e.preventDefault();
  ui.pick = ui.pick === cat.dataset.cat ? null : cat.dataset.cat;
  render(true);
});

/* Charts are sized to the measured container, so redraw them when that changes
   (rotation, Split View, Stage Manager, desktop window resize). */
let resizeTimer = null;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (ui.tab === "dash") render(true); }, 180);
}
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", onResize);

applyTheme();
render();
</script>
</body>
</html>
